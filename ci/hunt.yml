name: hunt

# OP TCG Hub — the hourly stock feed (A32, take 71). PASTED BY HAND ONCE into
# .github/workflows/hunt.yml, like build.yml and bootstrap.yml (APEX landmine
# 46: GITHUB_TOKEN cannot write workflows). Everything it runs lives in the
# tree, so the seed updates the behaviour; only this file needs a paste.
#
# What it does, every hour: rebuild www/ from the committed tree (no smoke, no
# render, no commit), fetch the retailer feed for the configured zip with
# tools/hunt.py, and deploy www/ to Pages. The app reads hunt/feed.json from
# Pages; the Play build never scrapes a retailer itself (A32).
#
# Cost: ~2 min of a free public-repo runner per run, 24 runs a day. Pages has
# a soft limit of ten deploys an hour; this is one.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'      # hourly, off the hour so it never races the 21:30 nightly

concurrency:
  group: pages                # never deploy over the nightly's Pages job
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild www/ from the committed tree, then fetch the feed
        run: |
          set -euo pipefail
          pip install --quiet pillow
          python3 tools/pipeline.py ingest history catalog app
          python3 tools/hunt.py --zips "${HUNT_ZIPS:-48329}" --radius "${HUNT_RADIUS:-50}"
        env:
          HUNT_ZIPS: ${{ vars.HUNT_ZIPS }}
          HUNT_RADIUS: ${{ vars.HUNT_RADIUS }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4
