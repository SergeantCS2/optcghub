name: hunt

# OP TCG Hub — the hourly stock feed (A32, take 71). Since take 89 it lives in
# git like every workflow: changed on a branch, kept BYTE-IDENTICAL to
# ci/hunt.yml (the gate compares the two); pasted by hand only if a push of
# .github/workflows is refused (RUNBOOK §5b). Everything it runs lives in the
# tree, so a merged take updates the behaviour without touching this file.
#
# What it does, every hour: rebuild www/ from the committed tree (no smoke, no
# render, no commit), fetch the retailer feed for the configured zip with
# tools/hunt.py, and deploy www/ to Pages. The app reads hunt/feed.json from
# Pages; the Play build never scrapes a retailer itself (A32).
#
# Cost: ~2 min of a free public-repo runner per run, 24 runs a day. Pages has
# a soft limit of ten deploys an hour; this is one.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'      # hourly, off the hour so it never races the 21:30 nightly

concurrency:
  group: pages                # never deploy over the nightly's Pages job
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Rebuild www/ from the committed tree, then fetch the feed
        run: |
          set -euo pipefail
          pip install --quiet pillow
          # the app build strips comments through acorn (tools/scrub.py --strip);
          # take 84: this workflow forgot to install it and would have gone red
          npm install --silent --no-save acorn
          python3 tools/pipeline.py ingest history catalog app
          python3 tools/hunt.py --zips "${HUNT_ZIPS:-48329}" --radius "${HUNT_RADIUS:-50}"
        env:
          HUNT_ZIPS: ${{ vars.HUNT_ZIPS }}
          HUNT_RADIUS: ${{ vars.HUNT_RADIUS }}
      - uses: actions/upload-pages-artifact@v5
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v5
