name: check

# OP TCG Hub — the PR check (take 89). Runs on every pull request into main:
# the whole pipeline (ingest, history, catalogue, hashes, validate, app, smoke,
# Chrome render, stamp, gate) on the PR's merge commit, and nothing that
# writes outside the runner — no price commit, no sidecar commit, no Pages, no
# release. build.yml does those, on main only (landmine 122). The token is
# read-only here on purpose: this job cannot publish anything even by mistake.
#
# Lives in git; kept BYTE-IDENTICAL to ci/check.yml (the gate compares the
# two). If a push of .github/workflows is refused, paste ci/check.yml here
# (RUNBOOK §5b).

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # hashes are the long pole the week a set drops: MEASURED 8.3/s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'    # Capacitor 8 requires Node 22+

      # The same cache the nightly writes on main; a PR may read it and its own
      # writes stay scoped to the PR (GitHub's cache isolation).
      - name: Restore catalogue cache
        uses: actions/cache@v5
        with:
          path: |
            tcgcsv_cache
            catalog/catalog.sqlite
          key: catalog-${{ github.run_number }}
          restore-keys: catalog-

      - name: Deps, the runner-owned-files guard, the whole pipeline
        run: bash ci/check.sh

      # The Chrome receipt (landmine 112), kept a week so a red render can be looked at.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: render
          path: www/render.png
          if-no-files-found: ignore
          retention-days: 7

      # take 129: what the pipeline built, for the apk job below (12 MB, a week)
      - uses: actions/upload-artifact@v6
        with:
          name: www
          path: www
          retention-days: 7

  # ── the APK, on every pull request (take 129, A44 item 1) ─────────────────
  # The same five steps as build.yml's apk job, on the PR's merge commit, with
  # NO secret: ci/apk.sh builds the sideload APK with the committed key (R8,
  # the shrink, the signer and the mapping read back off the artifact) and the
  # AAB dev-signed and named unfit to upload. Nothing is published -- the
  # token is read-only and the Release step lives in build.yml alone. Until
  # this job, a plugin, Gradle or R8 change was proven only after the merge
  # (takes 120, 121, 127, 128). The release variant, not a debug one: a debug
  # build runs no R8, and R8 is what bit (landmines 141, 183). The gate
  # (check_pr_builds_apk) keeps this job here.
  apk:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with: { name: www, path: www }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Build the sideload APK and a dev-signed AAB, as the merge will
        env:
          PR_CHECK: '1'
        run: bash ci/apk.sh
