name: build

# OP TCG Hub. Adapted from APEX ORV's workflow; the structural landmines it
# carries were paid for over there and cost nothing here.
#
#   seed   -> unpack a seed zip at the root and commit it (the RECOVERY route)
#   bundle -> build the catalogue, the app, run smoke + gate, commit the prices
#   pages  -> browser build + privacy policy (Play requires a live URL)
#   apk    -> signed APK for sideload, AAB for Play, Release take-N
#
# Since take 89 this file lives in git like everything else: changed on a
# branch, reviewed in the PR, kept BYTE-IDENTICAL to ci/build.yml (the gate
# compares the two). If a push of .github/workflows is ever refused, paste
# ci/build.yml here by hand (RUNBOOK §5b) -- and after any paste check that the
# `seed` job and 'optcghub-seed*.zip' under push.paths are still there: a paste
# dropped them once and every run rebuilt the same stale take at full green
# for a week (APEX landmine 202).
#
# `branches: [ main ]` is LOAD-BEARING (landmine 122): without it a branch
# commit touching any path below runs all of this on that branch -- cancels
# the nightly, commits prices to the branch, clobbers the Release, deploys
# Pages. Pull requests get check.yml, which can do none of those things.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'optcghub-seed*.zip'
      - BUILD
      - 'src/**'
      - 'tools/**'
      - 'ci/**'
      - package.json
      - capacitor.config.json
      - 'signing/**'
  schedule:
    # TCGCSV refreshes ~20:00 UTC daily (landmine 3). Building before that ships
    # a day-stale catalogue that reports itself current, so this runs after.
    - cron: '30 21 * * *'

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write        # A9's failure issue; missing on the first run (landmine 107)

jobs:
  # ── unpack the seed ─────────────────────────────────────────────────────
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Unpack any seed zip at the repo root and commit it
        run: |
          shopt -s nullglob
          zips=(optcghub-seed*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "no seed zip at root — building the committed tree as-is"; exit 0
          fi
          z="${zips[-1]}"
          echo "seed: $z  sha256 $(sha256sum "$z" | cut -c1-16)…"
          unzip -o -q "$z" -x '.github/*'
          rm -f optcghub-seed*.zip
          take=$(grep -oP 'VAULT_TAKE=\K[0-9]+' BUILD || echo '?')
          git config user.name  "optcghub-seed"
          git config user.email "optcghub-seed@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "seed identical to the tree — nothing to commit (take $take)"; exit 0
          fi
          git commit -q -m "seed: take $take from $z"
          git push
          echo "committed take $take"

  # ── build, verify, gate ─────────────────────────────────────────────────
  bundle:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 45     # hashes are the long pole: MEASURED 8.3/s, ~14 min
    # take 114 review: 'skip' when the carry-over could not read hunt/history.json
    # from Pages (ci/bundle.sh says why); the pages job below then does not run
    outputs:
      pages: ${{ steps.build.outputs.pages }}
    steps:
      # `ref` is REQUIRED. checkout defaults to the commit that TRIGGERED the
      # run; the seed job pushes a newer one, so a default checkout lands on a
      # tree without ci/bundle.sh (APEX landmine 85).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'    # Capacitor 8 requires Node 22+

      # Artwork is fetched, hashed and discarded (landmine 26). Caching the
      # HASHES rather than the images means a rebuild is seconds and no
      # copyrighted bytes ever persist anywhere in this repo's infrastructure.
      - name: Restore catalogue cache
        uses: actions/cache@v5
        with:
          path: |
            tcgcsv_cache
            catalog/catalog.sqlite
          key: catalog-${{ github.run_number }}
          restore-keys: catalog-

      - name: Build the catalogue, the app, and gate it
        id: build
        run: bash ci/bundle.sh

      # A9. A failed nightly is silent by default: the app keeps its last
      # catalogue and nobody is told. This opens ONE issue, labelled, and
      # appends to it on each further failure, so three bad nights are three
      # comments on one thread rather than nothing. GitHub also emails the
      # owner on workflow failure; the issue is what survives the email.
      # Landmine 125: the label must exist before anything is filed under it,
      # or every night opens a fresh unlabelled issue (#8-#11).
      - name: Report a failed night
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create nightly-failure --color B60205 --description "A9: the nightly catalogue build went red" --force >/dev/null
          n=$(gh issue list --label nightly-failure --state open --json number -q '.[0].number')
          body="Nightly build failed — run ${{ github.run_id }} on $(date -u +%Y-%m-%d). See the Actions log. The app keeps running on its last catalogue; the Home screen will show a stale banner after three days (A9)."
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
          else gh issue create --title "Nightly catalogue build is failing" --label nightly-failure --body "$body"; fi

      - name: Close the failure thread on a green night
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label nightly-failure --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$n" ]; then
            gh issue close "$n" --comment "Green again: run ${{ github.run_id }} on $(date -u +%Y-%m-%d)."
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: www
          path: www
          retention-days: 7

  # ── Pages: the privacy policy URL Play requires ─────────────────────────
  pages:
    needs: bundle
    # take 114 review: a deploy without hunt/history.json is the next hourly's
    # reset of the whole record, so a build whose carry-over could not read it
    # deploys nothing and Pages keeps the hourly's last deploy. The apk job
    # needs bundle alone: the APK and the Release go ahead.
    if: needs.bundle.outputs.pages != 'skip'
    runs-on: ubuntu-latest
    continue-on-error: true      # un-enabled Pages must not block the APK
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with: { name: www, path: www }
      - uses: actions/upload-pages-artifact@v5
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v5

  # ── package ─────────────────────────────────────────────────────────────
  apk:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}          # APEX landmine 85, again
      - uses: actions/download-artifact@v7
        with: { name: www, path: www }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      # Every job is a FRESH runner — the bundle job's pip install does not carry
      # over (APEX landmine 83). All logic lives in ci/apk.sh, which travels in
      # the tree; this file changes rarely and only through a PR.
      #
      # The Play upload key is a repository SECRET and never enters the tree
      # (landmine 23). With no secrets set the AAB is still built, dev-key-signed
      # and NAMED unfit to upload, so sideload testing never blocks on Play setup.
      - name: Build the signed APK and the Play AAB
        id: pkg
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          PLAY_UPLOAD_STORE_PASS:   ${{ secrets.PLAY_UPLOAD_STORE_PASS }}
          PLAY_UPLOAD_KEY_ALIAS:    ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASS:     ${{ secrets.PLAY_UPLOAD_KEY_PASS }}
        run: bash ci/apk.sh

      - uses: actions/upload-artifact@v6
        with: { name: apk, path: "${{ steps.pkg.outputs.apk }}" }
      - uses: actions/upload-artifact@v6
        with: { name: aab, path: "${{ steps.pkg.outputs.aab }}" }
      # take 103: R8's mapping rides the Release -- a Play crash report de-obfuscates
      # with it and with nothing else
      - uses: actions/upload-artifact@v6
        with: { name: mapping, path: "${{ steps.pkg.outputs.mapping }}" }

      # Release notes come from ci/RELEASE.md, in the REPO. Inline here they
      # would freeze at whatever take was last pasted (APEX landmine 96).
      # The nightly cron builds the SAME take with fresh prices; a second
      # `gh release create` on an existing tag fails. Create once, then
      # replace the assets (landmine 105).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="take-${{ steps.pkg.outputs.take }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.pkg.outputs.apk }}" "${{ steps.pkg.outputs.aab }}" "${{ steps.pkg.outputs.mapping }}" --clobber
            gh release edit "$tag" --notes-file ci/RELEASE.md
            echo "updated $tag with tonight's build"
          else
            gh release create "$tag" \
              "${{ steps.pkg.outputs.apk }}" "${{ steps.pkg.outputs.aab }}" "${{ steps.pkg.outputs.mapping }}" \
              --title "OP TCG Hub — take ${{ steps.pkg.outputs.take }}" \
              --notes-file ci/RELEASE.md
          fi
