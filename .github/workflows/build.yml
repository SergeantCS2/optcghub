name: build

# OP TCG Hub. Adapted from APEX ORV's workflow; the structural landmines it
# carries were paid for over there and cost nothing here.
#
#   seed   -> unpack a seed zip at the root and commit it (the RECOVERY route)
#   bundle -> build the catalogue, the app, run smoke + gate, commit the prices
#   pages  -> browser build + privacy policy (Play requires a live URL), with
#             the hourly's hunt/ files read again inside the `pages` group
#   apk    -> signed APK for sideload, AAB for Play, Release take-N (and the
#             Play icon)
#   report -> A9: one issue for any job that went red, closed only when every
#             job ran green
#
# Since take 89 this file lives in git like everything else: changed on a
# branch, reviewed in the PR, kept BYTE-IDENTICAL to ci/build.yml (the gate
# compares the two). If a push of .github/workflows is ever refused, paste
# ci/build.yml here by hand (RUNBOOK §5b) -- and after any paste check that the
# `seed` job and 'optcghub-seed*.zip' under push.paths are still there: a paste
# dropped them once and every run rebuilt the same stale take at full green
# for a week (APEX landmine 202).
#
# `branches: [ main ]` is LOAD-BEARING (landmine 122): without it a branch
# commit touching any path below runs all of this on that branch -- cancels
# the nightly, commits prices to the branch, clobbers the Release, deploys
# Pages. Pull requests get check.yml, which can do none of those things.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'optcghub-seed*.zip'
      - BUILD
      - 'src/**'
      - 'tools/**'
      - 'ci/**'
      - package.json
      - capacitor.config.json
      - 'signing/**'
  schedule:
    # TCGCSV refreshes ~20:00 UTC daily (landmine 3). Building before that ships
    # a day-stale catalogue that reports itself current, so this runs after.
    - cron: '30 21 * * *'

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write        # A9's failure issue; missing on the first run (landmine 107)

jobs:
  # ── unpack the seed ─────────────────────────────────────────────────────
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Unpack any seed zip at the repo root and commit it
        run: |
          shopt -s nullglob
          zips=(optcghub-seed*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "no seed zip at root — building the committed tree as-is"; exit 0
          fi
          z="${zips[-1]}"
          echo "seed: $z  sha256 $(sha256sum "$z" | cut -c1-16)…"
          unzip -o -q "$z" -x '.github/*'
          rm -f optcghub-seed*.zip
          take=$(grep -oP 'VAULT_TAKE=\K[0-9]+' BUILD || echo '?')
          git config user.name  "optcghub-seed"
          git config user.email "optcghub-seed@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "seed identical to the tree — nothing to commit (take $take)"; exit 0
          fi
          git commit -q -m "seed: take $take from $z"
          git push
          echo "committed take $take"

  # ── build, verify, gate ─────────────────────────────────────────────────
  bundle:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 45     # hashes are the long pole: MEASURED 8.3/s, ~14 min
    # take 114 review: 'skip' when the carry-over could not read hunt/history.json
    # from Pages (ci/bundle.sh says why); the pages job below then does not run
    outputs:
      pages: ${{ steps.build.outputs.pages }}
    steps:
      # `ref` is REQUIRED. checkout defaults to the commit that TRIGGERED the
      # run; the seed job pushes a newer one, so a default checkout lands on a
      # tree without ci/bundle.sh (APEX landmine 85).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'    # Capacitor 8 requires Node 22+

      # Artwork is fetched, hashed and discarded (landmine 26). Caching the
      # HASHES rather than the images means a rebuild is seconds and no
      # copyrighted bytes ever persist anywhere in this repo's infrastructure.
      - name: Restore catalogue cache
        uses: actions/cache@v5
        with:
          path: |
            tcgcsv_cache
            catalog/catalog.sqlite
          key: catalog-${{ github.run_number }}
          restore-keys: catalog-

      - name: Build the catalogue, the app, and gate it
        id: build
        run: bash ci/bundle.sh

      # A9's report is the report job at the end: it covers every job (take 115)
      - uses: actions/upload-artifact@v6
        with:
          name: www
          path: www
          retention-days: 7

  # ── Pages: the privacy policy URL Play requires ─────────────────────────
  pages:
    needs: bundle
    # take 114 review: a deploy without hunt/history.json is the next hourly's
    # reset of the whole record, so a build whose carry-over could not read it
    # deploys nothing and Pages keeps the hourly's last deploy. The apk job
    # needs bundle alone: the APK and the Release go ahead.
    if: needs.bundle.outputs.pages != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Take 115: the nightly race. Pages is one site with two deployers, and the
    # bundle job's carry-over reads hunt/ before this job starts: an hourly
    # that deployed in between lost its row. So this job reads hunt/ again,
    # then deploys, inside the `pages` group -- hunt.yml's whole run holds the
    # same group -- and no hourly lands between the read and the deploy. While
    # an hourly runs this job waits; GitHub keeps one waiting run per group, so
    # a newer hourly queued meanwhile cancels it (rare: two hourlies inside two
    # minutes) and the report job says so. No continue-on-error (it stood here
    # for an un-enabled Pages): it would show a failed deploy to the report
    # job as a success, and the apk job never waits on this one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      pages: ${{ steps.carry.outputs.pages }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}          # tools/hunt.py for the carry-over; APEX landmine 85
      - uses: actions/download-artifact@v7
        with: { name: www, path: www }
      - name: Read the hourly's files again, inside the pages group
        id: carry
        run: bash ci/bundle.sh --carry-over
      - uses: actions/upload-pages-artifact@v5
        if: steps.carry.outputs.pages != 'skip'
        with: { path: www }
      - id: deploy
        if: steps.carry.outputs.pages != 'skip'
        uses: actions/deploy-pages@v5

  # ── package ─────────────────────────────────────────────────────────────
  apk:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}          # APEX landmine 85, again
      - uses: actions/download-artifact@v7
        with: { name: www, path: www }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      # Every job is a FRESH runner — the bundle job's pip install does not carry
      # over (APEX landmine 83). All logic lives in ci/apk.sh, which travels in
      # the tree; this file changes rarely and only through a PR.
      #
      # The Play upload key is a repository SECRET and never enters the tree
      # (landmine 23). With no secrets set the AAB is still built, dev-key-signed
      # and NAMED unfit to upload, so sideload testing never blocks on Play setup.
      - name: Build the signed APK and the Play AAB
        id: pkg
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          PLAY_UPLOAD_STORE_PASS:   ${{ secrets.PLAY_UPLOAD_STORE_PASS }}
          PLAY_UPLOAD_KEY_ALIAS:    ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASS:     ${{ secrets.PLAY_UPLOAD_KEY_PASS }}
        run: bash ci/apk.sh

      - uses: actions/upload-artifact@v6
        with: { name: apk, path: "${{ steps.pkg.outputs.apk }}" }
      - uses: actions/upload-artifact@v6
        with: { name: aab, path: "${{ steps.pkg.outputs.aab }}" }
      # take 103: R8's mapping rides the Release -- a Play crash report de-obfuscates
      # with it and with nothing else
      - uses: actions/upload-artifact@v6
        with: { name: mapping, path: "${{ steps.pkg.outputs.mapping }}" }

      # Take 115: the Play icon rides the Release. ci/apk.sh's icon step
      # (ci/icon.py) draws play-assets/icon-512.png from assets/icon*.svg and
      # checks it on every build; the owner uploads it to the listing by hand.
      # Release notes come from ci/RELEASE.md, in the REPO. Inline here they
      # would freeze at whatever take was last pasted (APEX landmine 96).
      # The nightly cron builds the SAME take with fresh prices; a second
      # `gh release create` on an existing tag fails. Create once, then
      # replace the assets (landmine 105).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="take-${{ steps.pkg.outputs.take }}"
          icon="play-assets/icon-512.png#Play icon, 512x512"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.pkg.outputs.apk }}" "${{ steps.pkg.outputs.aab }}" "${{ steps.pkg.outputs.mapping }}" "$icon" --clobber
            gh release edit "$tag" --notes-file ci/RELEASE.md
            echo "updated $tag with tonight's build"
          else
            gh release create "$tag" \
              "${{ steps.pkg.outputs.apk }}" "${{ steps.pkg.outputs.aab }}" "${{ steps.pkg.outputs.mapping }}" "$icon" \
              --title "OP TCG Hub — take ${{ steps.pkg.outputs.take }}" \
              --notes-file ci/RELEASE.md
          fi

  # ── A9: the failure report, for every job ───────────────────────────────
  # A failed nightly is silent by default: the app keeps its last catalogue
  # and nobody is told. This opens ONE issue, labelled, and appends to it on
  # each further failure, so three bad nights are three comments on one
  # thread rather than nothing. GitHub also emails the owner on workflow
  # failure; the issue is what survives the email. Landmine 125: the label
  # must exist before anything is filed under it, or every night opens a
  # fresh unlabelled issue (#8-#11).
  # Take 115: through take 114 only the bundle job reported, and its green
  # closed the thread while the apk or the pages job could still fail. This
  # job needs every other one: any red job opens or comments; the thread
  # closes only when every job ran green -- a deploy skipped on pages=skip
  # leaves it as it is. A run cancelled by a newer one reports nothing. It
  # needs no checkout, so it reports a tree too broken to build.
  # hunt.yml's report job runs the same lines under its own label.
  report:
    needs: [seed, bundle, pages, apk]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report a failed job, or close the thread when every job ran green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: nightly-failure
          TITLE: The nightly build is failing
          KEEPS: The app keeps running on its last catalogue; the Home screen will show a stale banner after three days (A9).
        run: |
          set -euo pipefail
          # Every job this one needs, and how it ended. A job that failed, or
          # was cancelled in a run that was not (a waiting pages job a newer
          # hourly replaced), is red. Every job a success is green. Anything
          # else -- a Pages deploy skipped on pages=skip -- is neither:
          # nothing is opened and nothing is closed.
          v=$(python3 -c '
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          res = {job: n.get("result") for job, n in needs.items()}
          red = [job for job, r in res.items() if r in ("failure", "cancelled")]
          off = [job + " " + str(r) for job, r in res.items() if r != "success"]
          off += [job + " pages=skip" for job, n in needs.items() if (n.get("outputs") or {}).get("pages") == "skip"]
          print("red " + ", ".join(red) if red else "partial " + "; ".join(off) if off or not res else "green " + ", ".join(res))
          ')
          verdict=${v%% *}; what=${v#* }; day=$(date -u +%Y-%m-%d)
          case "$verdict" in
            red)
              gh label create "$LABEL" --color B60205 --description "$TITLE" --force >/dev/null
              n=$(gh issue list --label "$LABEL" --state open --json number -q '.[0].number')
              body="Failed: $what -- run $RUN on $day. See its log. $KEEPS"
              if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
              else gh issue create --title "$TITLE" --label "$LABEL" --body "$body"; fi ;;
            green)
              n=$(gh issue list --label "$LABEL" --state open --json number -q '.[0].number' 2>/dev/null || true)
              if [ -n "$n" ]; then gh issue close "$n" --comment "Green again, every job ($what): run $RUN on $day."; fi
              echo "every job ran green: $what" ;;
            *)
              echo "::notice::no job failed, but not every job ran green ($what): the failure thread is left as it is" ;;
          esac
