<!-- OP TCG Hub app icon (D7), the owner's pick. The card on the sea carries Bandai's printed card-back emblem, drawn here after the printed back and shipped at the owner's word: the record had ruled a publisher mark out of the icon (landmines 30, 31; AGENDA A16), and design/d7-icons/SHIP.md records the reversal and its risk. The rest is our own: the sky, the sand, the sea and its waves, the purple frame, and the word DON!! as a manga sound effect. No character, no wordmark. Adaptive foreground layer, 108 dp; inside the 66 dp safe zone. -->
